<head>
  <!-- Define o conjunto de caracteres como UTF-8 para suporte a acentos e caracteres especiais -->
  <meta charset="UTF-8" />
  <!-- Configura a viewport para tornar a página responsiva em dispositivos móveis -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Título exibido na aba do navegador -->
  <title>Scratch no Ensino Fundamental II | Cartilha Pedagógica UTFPR</title>
  <!-- Link para o arquivo CSS externo que contém os estilos da página -->
  <link rel="stylesheet" href="../assets/css/cabecalho.css" />
</head>

<!-- Cabeçalho principal da página, dividido em duas partes: topo e menu de navegação -->
<header>
  <!-- Div para o topo do cabeçalho (logotipo e título institucional) -->
  <div class="header-top">
    <!-- Container centraliza e limita a largura do conteúdo -->
    <div class="container">
      <!-- Container do logotipo e nome da instituição -->
      <div class="logo-container">
        <!-- Imagem do logotipo da UTFPR -->
        <img
          src="../assets/images/UTFPR_logo.png"
          alt="UTFPR Logo"
          class="logo"
        />
        <!-- Nome da universidade com um pequeno texto para o campus -->
        <div class="institution-name">
          Universidade Tecnológica Federal do Paraná<br />
          <small>Campus Siqueira Campos</small>
        </div>
      </div>
      <!-- Título principal do portal, com subtítulo -->
      <div class="header-title">
        Revolução Digital: <br />Desvendando Algoritmos, Reconectando
        Humanidade<br />
        <small>Material Didático para Professores do 1º ao 3º Ano</small>
      </div>
    </div>
  </div>
</header>
